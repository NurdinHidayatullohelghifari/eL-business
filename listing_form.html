{% extends "base.html" %}{% block content %}<section class="form-wrap"><form class="panel" method="post"><span class="eyebrow">PUBLISH AN OFFER</span><h1>Tambah listing</h1><p class="muted">Listing akan diperiksa administrator sebelum tampil secara publik.</p><label>Modul<select name="module" required><option value="">Pilih modul</option>{% for key,data in modules.items() %}<option value="{{ key }}">{{ data[0] }}</option>{% endfor %}</select></label><label>Judul penawaran<input name="title" required maxlength="180"></label><label>Kategori<input name="category" placeholder="Contoh: kapas, lahan industri, logistik"></label><label>Deskripsi<textarea name="description" required rows="5"></textarea></label><label>Harga / indikasi harga<input name="price_text" placeholder="Contoh: Rp... / Nego / Hubungi penjual"></label><label>Lokasi<input name="location"></label><div class="two"><label>Nama kontak<input name="contact_name"></label><label>Nomor WhatsApp<input name="contact_phone"></label></div><label>Email kontak<input type="email" name="contact_email"></label><button class="btn primary full">Kirim untuk ditinjau</button></form></section>{% endblock %}
